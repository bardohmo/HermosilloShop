<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Artículos HermosilloShop</title>
  <style>
    :root {
      --bg-0: #05060d;
      --bg-1: #0a0c18;
      --bg-2: #101428;
      --panel: rgba(12, 16, 36, 0.78);
      --panel-solid: #0e1224;
      --line: rgba(0, 245, 255, 0.18);
      --line-strong: rgba(0, 245, 255, 0.42);
      --cyan: #00f5ff;
      --magenta: #ff2bd6;
      --violet: #8b5cff;
      --text: #e8f7ff;
      --muted: #8aa0b8;
      --danger: #ff4d6d;
      --ok: #3dff9a;
      --shadow: 0 0 24px rgba(0, 245, 255, 0.12);
      --radius: 16px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      font-family: var(--font);
      color: var(--text);
      background: var(--bg-0);
    }

    body {
      position: relative;
      overflow-x: hidden;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(0, 245, 255, 0.12), transparent 55%),
        radial-gradient(900px 500px at 90% 0%, rgba(255, 43, 214, 0.1), transparent 50%),
        radial-gradient(700px 400px at 50% 100%, rgba(139, 92, 255, 0.08), transparent 45%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, #070a14);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 245, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
      z-index: 0;
    }

    .app {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 28px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.06), rgba(255, 43, 214, 0.05));
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .brand h1 {
      font-size: clamp(1.35rem, 3.5vw, 1.85rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.15;
    }

    .brand h1 .title-prefix {
      color: var(--text);
      opacity: 0.92;
      margin-right: 0.28em;
    }

    .brand h1 .shop-name {
      background: linear-gradient(
        90deg,
        #00f5ff 0%,
        #3dff9a 18%,
        #7ef9ff 32%,
        #8b5cff 48%,
        #ff2bd6 65%,
        #ff9a3d 82%,
        #00f5ff 100%
      );
      background-size: 220% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: neonFlow 6s linear infinite;
      filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.35)) drop-shadow(0 0 18px rgba(255, 43, 214, 0.25));
    }

    @keyframes neonFlow {
      0% { background-position: 0% 50%; }
      100% { background-position: 220% 50%; }
    }

    .brand p {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .card-media {
      max-height: 160px;
    }

    @media (min-width: 640px) {
      .card-media { max-height: 180px; }
    }

    .header-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button, .btn {
      appearance: none;
      border: 1px solid var(--line-strong);
      background: linear-gradient(180deg, rgba(0, 245, 255, 0.12), rgba(0, 245, 255, 0.04));
      color: var(--text);
      font: inherit;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 11px 16px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      box-shadow: 0 0 0 0 rgba(0, 245, 255, 0);
    }

    button:hover, .btn:hover {
      transform: translateY(-1px);
      border-color: var(--cyan);
      box-shadow: 0 0 18px rgba(0, 245, 255, 0.25);
    }

    button:active, .btn:active { transform: translateY(0); }

    button.primary {
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.35), rgba(139, 92, 255, 0.25));
      border-color: var(--cyan);
      color: #041018;
      text-shadow: none;
    }

    button.ghost {
      background: transparent;
      border-color: var(--line);
      color: var(--muted);
    }

    button.danger {
      background: rgba(255, 77, 109, 0.12);
      border-color: rgba(255, 77, 109, 0.45);
      color: #ffb3c1;
    }

    button.danger:hover {
      border-color: var(--danger);
      box-shadow: 0 0 16px rgba(255, 77, 109, 0.3);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
    }

    .search {
      flex: 1 1 220px;
      position: relative;
    }

    .search input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.12);
    }

    .search::before {
      content: "⌕";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1.1rem;
      pointer-events: none;
    }

    .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.25);
      color: var(--muted);
      font-size: 0.82rem;
    }

    .stat strong {
      color: var(--cyan);
      font-weight: 700;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--panel);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      border-color: var(--line-strong);
      transform: translateY(-2px);
      box-shadow: 0 0 28px rgba(0, 245, 255, 0.16);
    }

    .card-media {
      position: relative;
      aspect-ratio: 4 / 3;
      background:
        linear-gradient(135deg, rgba(0, 245, 255, 0.08), rgba(255, 43, 214, 0.06)),
        var(--bg-2);
      overflow: hidden;
    }

    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-media .placeholder {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.85rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid transparent;
      backdrop-filter: blur(8px);
    }

    .badge.ok {
      background: rgba(61, 255, 154, 0.15);
      border-color: rgba(61, 255, 154, 0.35);
      color: var(--ok);
    }

    .badge.low {
      background: rgba(255, 43, 214, 0.15);
      border-color: rgba(255, 43, 214, 0.4);
      color: #ff9ae6;
    }

    .badge.out {
      background: rgba(255, 77, 109, 0.15);
      border-color: rgba(255, 77, 109, 0.4);
      color: #ff9aab;
    }

    .card-body {
      padding: 14px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .card-body h3 {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.3;
      word-break: break-word;
    }

    .price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--cyan);
      letter-spacing: 0.02em;
      text-shadow: 0 0 12px rgba(0, 245, 255, 0.35);
    }

    .meta {
      color: var(--muted);
      font-size: 0.85rem;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 4px;
    }

    .card-actions button {
      flex: 1;
      padding: 9px 10px;
      font-size: 0.85rem;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 56px 20px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: rgba(0, 0, 0, 0.2);
      color: var(--muted);
    }

    .empty strong {
      display: block;
      color: var(--text);
      font-size: 1.1rem;
      margin-bottom: 8px;
    }

    /* Modal */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(2, 4, 12, 0.72);
      backdrop-filter: blur(8px);
      display: none;
      align-items: flex-end;
      justify-content: center;
      padding: 16px;
    }

    .overlay.open { display: flex; }

    @media (min-width: 640px) {
      .overlay { align-items: center; }
    }

    .modal {
      width: min(520px, 100%);
      max-height: min(92vh, 900px);
      overflow: auto;
      border-radius: calc(var(--radius) + 4px);
      border: 1px solid var(--line-strong);
      background: linear-gradient(180deg, #10162c, #0a0e1c);
      box-shadow: 0 0 40px rgba(0, 245, 255, 0.15), 0 20px 50px rgba(0, 0, 0, 0.55);
      padding: 20px;
    }

    .modal h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .form-grid {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--muted);
    }

    label span { font-weight: 600; color: var(--text); }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      font: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.12);
    }

    textarea { min-height: 72px; resize: vertical; }

    .photo-row {
      display: grid;
      gap: 10px;
    }

    .photo-preview {
      width: 100%;
      aspect-ratio: 16 / 10;
      border-radius: 12px;
      border: 1px dashed var(--line);
      background: var(--bg-2);
      overflow: hidden;
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .photo-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .photo-actions input[type="file"] { display: none; }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(20px);
      z-index: 80;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid var(--line-strong);
      background: rgba(8, 12, 28, 0.92);
      color: var(--text);
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      box-shadow: 0 0 24px rgba(0, 245, 255, 0.2);
      max-width: calc(100% - 32px);
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      margin-top: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      .row-2 { grid-template-columns: 1fr; }
      header { padding: 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1><span class="title-prefix">Artículos</span><span class="shop-name">HermosilloShop</span></h1>
        <p>Catálogo neon · precios y existencias en vivo</p>
      </div>
      <div class="header-actions">
        <button type="button" class="ghost" id="btnImport" title="Cargar catálogo desde JSON">Importar</button>
        <button type="button" class="ghost" id="btnExport" title="Descargar respaldo JSON">Exportar</button>
        <button type="button" class="primary" id="btnAdd">+ Agregar artículo</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden />
      </div>
    </header>

    <div class="toolbar">
      <div class="search">
        <input type="search" id="search" placeholder="Buscar por nombre..." autocomplete="off" />
      </div>
      <div class="stats">
        <div class="stat">Artículos: <strong id="statCount">0</strong></div>
        <div class="stat">Stock total: <strong id="statStock">0</strong></div>
      </div>
    </div>

    <div class="grid" id="grid" aria-live="polite"></div>

    <footer>HermosilloShop · datos guardados en este dispositivo</footer>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle">Nuevo artículo</h2>
      <form id="form" class="form-grid" novalidate>
        <input type="hidden" id="editId" />
        <label>
          <span>Nombre</span>
          <input type="text" id="name" required maxlength="80" placeholder="Ej. Powerbank 20000mAh" />
        </label>
        <label>
          <span>Descripción (opcional)</span>
          <textarea id="description" maxlength="240" placeholder="Detalles del producto"></textarea>
        </label>
        <div class="row-2">
          <label>
            <span>Precio (MXN)</span>
            <input type="number" id="price" required min="0" step="0.01" placeholder="0.00" />
          </label>
          <label>
            <span>Existencia</span>
            <input type="number" id="stock" required min="0" step="1" placeholder="0" />
          </label>
        </div>
        <div class="photo-row">
          <span style="font-size:0.85rem;color:var(--muted)"><strong style="color:var(--text)">Foto</strong></span>
          <div class="photo-preview" id="photoPreview">Sin foto</div>
          <div class="photo-actions">
            <button type="button" id="btnPickPhoto">Elegir foto</button>
            <button type="button" class="ghost" id="btnClearPhoto">Quitar foto</button>
            <input type="file" id="photoFile" accept="image/*" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="ghost" id="btnCancel">Cancelar</button>
          <button type="submit" class="primary" id="btnSave">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    const STORAGE_KEY = "hermosillo_shop_articles_v1";

    /** @typedef {{ id: string, name: string, description: string, price: number, stock: number, photo: string|null, updatedAt: number }} Article */

    const els = {
      grid: document.getElementById("grid"),
      search: document.getElementById("search"),
      statCount: document.getElementById("statCount"),
      statStock: document.getElementById("statStock"),
      overlay: document.getElementById("overlay"),
      form: document.getElementById("form"),
      modalTitle: document.getElementById("modalTitle"),
      editId: document.getElementById("editId"),
      name: document.getElementById("name"),
      description: document.getElementById("description"),
      price: document.getElementById("price"),
      stock: document.getElementById("stock"),
      photoPreview: document.getElementById("photoPreview"),
      photoFile: document.getElementById("photoFile"),
      btnAdd: document.getElementById("btnAdd"),
      btnExport: document.getElementById("btnExport"),
      btnImport: document.getElementById("btnImport"),
      importFile: document.getElementById("importFile"),
      btnCancel: document.getElementById("btnCancel"),
      btnPickPhoto: document.getElementById("btnPickPhoto"),
      btnClearPhoto: document.getElementById("btnClearPhoto"),
      toast: document.getElementById("toast"),
    };

    /** @type {Article[]} */
    let articles = load();
    /** @type {string|null} */
    let pendingPhoto = null;
    let toastTimer = 0;

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return seed();
        const data = JSON.parse(raw);
        if (!Array.isArray(data)) return seed();
        return data;
      } catch {
        return seed();
      }
    }

    function seed() {
      const now = Date.now();
      return [
        {
          id: uid(),
          name: "Powerbank Neo 20K",
          description: "Carga rápida USB-C, carcasa mate.",
          price: 499,
          stock: 18,
          photo: null,
          updatedAt: now,
        },
        {
          id: uid(),
          name: "Auriculares Pulse X",
          description: "Bluetooth 5.3, 32 h de batería.",
          price: 349,
          stock: 7,
          photo: null,
          updatedAt: now,
        },
        {
          id: uid(),
          name: "Cable LED USB-C",
          description: "1.2 m con iluminación RGB.",
          price: 129,
          stock: 0,
          photo: null,
          updatedAt: now,
        },
      ];
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(articles));
    }

    function money(n) {
      return new Intl.NumberFormat("es-MX", {
        style: "currency",
        currency: "MXN",
        maximumFractionDigits: 2,
      }).format(Number(n) || 0);
    }

    function stockBadge(stock) {
      if (stock <= 0) return { cls: "out", text: "Agotado" };
      if (stock <= 5) return { cls: "low", text: "Bajo stock" };
      return { cls: "ok", text: "En stock" };
    }

    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2200);
    }

    function filtered() {
      const q = els.search.value.trim().toLowerCase();
      if (!q) return [...articles].sort((a, b) => b.updatedAt - a.updatedAt);
      return articles
        .filter((a) => a.name.toLowerCase().includes(q) || (a.description || "").toLowerCase().includes(q))
        .sort((a, b) => b.updatedAt - a.updatedAt);
    }

    function render() {
      const list = filtered();
      els.statCount.textContent = String(articles.length);
      els.statStock.textContent = String(articles.reduce((s, a) => s + (Number(a.stock) || 0), 0));

      if (list.length === 0) {
        els.grid.innerHTML = `
          <div class="empty">
            <strong>${articles.length === 0 ? "Sin artículos aún" : "Sin resultados"}</strong>
            ${articles.length === 0 ? "Toca “Agregar artículo” para crear el primero." : "Prueba con otro término de búsqueda."}
          </div>`;
        return;
      }

      els.grid.innerHTML = list
        .map((a) => {
          const badge = stockBadge(a.stock);
          const media = a.photo
            ? `<img src="${a.photo}" alt="${escapeAttr(a.name)}" />`
            : `<div class="placeholder">Sin foto</div>`;
          return `
            <article class="card" data-id="${a.id}">
              <div class="card-media">
                ${media}
                <span class="badge ${badge.cls}">${badge.text}</span>
              </div>
              <div class="card-body">
                <h3>${escapeHtml(a.name)}</h3>
                <div class="price">${money(a.price)}</div>
                <div class="meta">Existencia: <strong style="color:var(--text)">${Number(a.stock) || 0}</strong></div>
                ${a.description ? `<div class="meta">${escapeHtml(a.description)}</div>` : ""}
                <div class="card-actions">
                  <button type="button" data-action="edit">Editar</button>
                  <button type="button" class="danger" data-action="delete">Eliminar</button>
                </div>
              </div>
            </article>`;
        })
        .join("");
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, "&#39;");
    }

    function openModal(article) {
      if (article) {
        els.modalTitle.textContent = "Editar artículo";
        els.editId.value = article.id;
        els.name.value = article.name;
        els.description.value = article.description || "";
        els.price.value = String(article.price);
        els.stock.value = String(article.stock);
        pendingPhoto = article.photo;
      } else {
        els.modalTitle.textContent = "Nuevo artículo";
        els.editId.value = "";
        els.form.reset();
        pendingPhoto = null;
      }
      renderPhotoPreview();
      els.overlay.classList.add("open");
      setTimeout(() => els.name.focus(), 50);
    }

    function closeModal() {
      els.overlay.classList.remove("open");
      pendingPhoto = null;
      els.photoFile.value = "";
    }

    function renderPhotoPreview() {
      if (pendingPhoto) {
        els.photoPreview.innerHTML = `<img src="${pendingPhoto}" alt="Vista previa" />`;
      } else {
        els.photoPreview.textContent = "Sin foto";
      }
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        if (!file) return resolve(null);
        if (!file.type.startsWith("image/")) {
          reject(new Error("El archivo debe ser una imagen."));
          return;
        }
        if (file.size > 2.5 * 1024 * 1024) {
          reject(new Error("La imagen debe pesar menos de 2.5 MB."));
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            /* Imágenes más compactas para el catálogo y localStorage */
            const max = 480;
            let { width, height } = img;
            if (width > max || height > max) {
              const scale = Math.min(max / width, max / height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.68));
          };
          img.onerror = () => reject(new Error("No se pudo leer la imagen."));
          img.src = String(reader.result);
        };
        reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
        reader.readAsDataURL(file);
      });
    }

    els.btnAdd.addEventListener("click", () => openModal(null));
    els.btnCancel.addEventListener("click", closeModal);
    els.overlay.addEventListener("click", (e) => {
      if (e.target === els.overlay) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && els.overlay.classList.contains("open")) closeModal();
    });

    els.btnPickPhoto.addEventListener("click", () => els.photoFile.click());
    els.btnClearPhoto.addEventListener("click", () => {
      pendingPhoto = null;
      els.photoFile.value = "";
      renderPhotoPreview();
    });

    els.photoFile.addEventListener("change", async () => {
      const file = els.photoFile.files && els.photoFile.files[0];
      if (!file) return;
      try {
        pendingPhoto = await readFileAsDataURL(file);
        renderPhotoPreview();
      } catch (err) {
        toast(err.message || "Error al cargar la foto");
        els.photoFile.value = "";
      }
    });

    els.form.addEventListener("submit", (e) => {
      e.preventDefault();
      const name = els.name.value.trim();
      const description = els.description.value.trim();
      const price = Number(els.price.value);
      const stock = Number(els.stock.value);

      if (!name) {
        toast("Escribe un nombre");
        els.name.focus();
        return;
      }
      if (!Number.isFinite(price) || price < 0) {
        toast("Precio inválido");
        els.price.focus();
        return;
      }
      if (!Number.isFinite(stock) || stock < 0 || !Number.isInteger(stock)) {
        toast("Existencia inválida (usa enteros)");
        els.stock.focus();
        return;
      }

      const id = els.editId.value;
      if (id) {
        const idx = articles.findIndex((a) => a.id === id);
        if (idx === -1) {
          toast("Artículo no encontrado");
          return;
        }
        articles[idx] = {
          ...articles[idx],
          name,
          description,
          price,
          stock,
          photo: pendingPhoto,
          updatedAt: Date.now(),
        };
        toast("Artículo actualizado");
      } else {
        articles.push({
          id: uid(),
          name,
          description,
          price,
          stock,
          photo: pendingPhoto,
          updatedAt: Date.now(),
        });
        toast("Artículo agregado");
      }
      save();
      closeModal();
      render();
    });

    els.grid.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const card = btn.closest("[data-id]");
      if (!card) return;
      const id = card.getAttribute("data-id");
      const article = articles.find((a) => a.id === id);
      if (!article) return;

      if (btn.getAttribute("data-action") === "edit") {
        openModal(article);
        return;
      }
      if (btn.getAttribute("data-action") === "delete") {
        if (!confirm(`¿Eliminar “${article.name}”?`)) return;
        articles = articles.filter((a) => a.id !== id);
        save();
        render();
        toast("Artículo eliminado");
      }
    });

    els.search.addEventListener("input", render);

    els.btnExport.addEventListener("click", () => {
      const payload = {
        app: "HermosilloShop",
        version: 1,
        exportedAt: new Date().toISOString(),
        articles,
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "hermosillo-shop-catalogo.json";
      a.click();
      URL.revokeObjectURL(url);
      toast("Catálogo exportado");
    });

    els.btnImport.addEventListener("click", () => els.importFile.click());

    els.importFile.addEventListener("change", async () => {
      const file = els.importFile.files && els.importFile.files[0];
      els.importFile.value = "";
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const list = Array.isArray(data) ? data : data.articles;
        if (!Array.isArray(list) || list.length === 0) {
          toast("El archivo no tiene artículos válidos");
          return;
        }
        const cleaned = list
          .map((item) => {
            if (!item || typeof item !== "object") return null;
            const name = String(item.name || "").trim();
            if (!name) return null;
            const price = Number(item.price);
            const stock = Number(item.stock);
            return {
              id: item.id && String(item.id) ? String(item.id) : uid(),
              name: name.slice(0, 80),
              description: String(item.description || "").slice(0, 240),
              price: Number.isFinite(price) && price >= 0 ? price : 0,
              stock: Number.isFinite(stock) && stock >= 0 ? Math.floor(stock) : 0,
              photo: typeof item.photo === "string" && item.photo.startsWith("data:image")
                ? item.photo
                : null,
              updatedAt: Number(item.updatedAt) || Date.now(),
            };
          })
          .filter(Boolean);
        if (cleaned.length === 0) {
          toast("No se pudo leer ningún artículo");
          return;
        }
        const mode = confirm(
          `Se encontraron ${cleaned.length} artículo(s).\n\nAceptar = reemplazar todo el catálogo\nCancelar = fusionar con los actuales`
        );
        if (mode) {
          articles = cleaned;
        } else {
          const byId = new Map(articles.map((a) => [a.id, a]));
          for (const a of cleaned) {
            byId.set(a.id, a);
          }
          const byName = new Map();
          for (const a of byId.values()) {
            const key = a.name.toLowerCase();
            if (!byName.has(key) || a.updatedAt > byName.get(key).updatedAt) {
              byName.set(key, a);
            }
          }
          articles = [...byName.values()];
        }
        save();
        render();
        toast(mode ? "Catálogo reemplazado" : "Catálogo fusionado");
      } catch {
        toast("No se pudo importar ese archivo");
      }
    });

    // Primera carga
    save();
    render();
  </script>
</body>
</html>

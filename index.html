<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Artículos HermosilloShop</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-0: #05060d;
      --bg-1: #0a0c18;
      --bg-2: #101428;
      --panel: rgba(12, 16, 36, 0.78);
      --line: rgba(0, 245, 255, 0.18);
      --line-strong: rgba(0, 245, 255, 0.42);
      --cyan: #00f5ff;
      --magenta: #ff2bd6;
      --violet: #8b5cff;
      --text: #e8f7ff;
      --muted: #8aa0b8;
      --danger: #ff4d6d;
      --ok: #3dff9a;
      --shadow: 0 0 24px rgba(0, 245, 255, 0.12);
      --radius: 16px;
      --font: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; font-family: var(--font); color: var(--text); background: var(--bg-0); }
    body {
      position: relative; overflow-x: hidden;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(0, 245, 255, 0.12), transparent 55%),
        radial-gradient(900px 500px at 90% 0%, rgba(255, 43, 214, 0.1), transparent 50%),
        radial-gradient(700px 400px at 50% 100%, rgba(139, 92, 255, 0.08), transparent 45%),
        linear-gradient(180deg, var(--bg-0), var(--bg-1) 40%, #070a14);
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(0, 245, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 245, 255, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 20%, transparent 75%);
    }
    .app { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
    header {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px;
      margin-bottom: 20px; padding: 20px 22px; border: 1px solid var(--line);
      border-radius: calc(var(--radius) + 4px);
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.06), rgba(255, 43, 214, 0.05));
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.03);
    }
    .brand { display: flex; flex-direction: column; gap: 4px; }
    .brand h1 {
      font-size: clamp(1.35rem, 3.5vw, 1.85rem); font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; line-height: 1.15;
    }
    .brand h1 .title-prefix { color: var(--text); opacity: 0.92; margin-right: 0.28em; }
    .brand h1 .shop-name {
      background: linear-gradient(90deg, #00f5ff 0%, #3dff9a 18%, #7ef9ff 32%, #8b5cff 48%, #ff2bd6 65%, #ff9a3d 82%, #00f5ff 100%);
      background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
      animation: neonFlow 6s linear infinite;
      filter: drop-shadow(0 0 10px rgba(0, 245, 255, 0.35)) drop-shadow(0 0 18px rgba(255, 43, 214, 0.25));
    }
    @keyframes neonFlow { 0% { background-position: 0% 50%; } 100% { background-position: 220% 50%; } }
    .brand p { color: var(--muted); font-size: 0.9rem; }
    .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button, .btn {
      appearance: none; border: 1px solid var(--line-strong);
      background: linear-gradient(180deg, rgba(0, 245, 255, 0.12), rgba(0, 245, 255, 0.04));
      color: var(--text); font: inherit; font-weight: 600; font-size: 0.92rem;
      padding: 11px 16px; border-radius: 999px; cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    button:hover { transform: translateY(-1px); border-color: var(--cyan); box-shadow: 0 0 18px rgba(0, 245, 255, 0.25); }
    button.primary {
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.35), rgba(139, 92, 255, 0.25));
      border-color: var(--cyan); color: #041018;
    }
    button.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
    button.danger { background: rgba(255, 77, 109, 0.12); border-color: rgba(255, 77, 109, 0.45); color: #ffb3c1; }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
    .status-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; font-size: 0.85rem; color: var(--muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 8px rgba(255, 77, 109, 0.6); }
    .status-dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(61, 255, 154, 0.6); }
    .status-dot.warn { background: #ffb020; box-shadow: 0 0 8px rgba(255, 176, 32, 0.5); }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; align-items: center; }
    .search { flex: 1 1 220px; position: relative; }
    .search input {
      width: 100%; padding: 12px 14px 12px 40px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--panel); color: var(--text); font: inherit; outline: none;
    }
    .search input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.12); }
    .search::before { content: "⌕"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 1.1rem; pointer-events: none; }
    .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .stat { padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(0,0,0,0.25); color: var(--muted); font-size: 0.82rem; }
    .stat strong { color: var(--cyan); font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .card {
      display: flex; flex-direction: column; border-radius: var(--radius); border: 1px solid var(--line);
      background: var(--panel); overflow: hidden; box-shadow: var(--shadow);
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .card:hover { border-color: var(--line-strong); transform: translateY(-2px); }
    .card-media {
      position: relative; aspect-ratio: 16 / 9; max-height: 72px;
      background: linear-gradient(135deg, rgba(0, 245, 255, 0.08), rgba(255, 43, 214, 0.06)), var(--bg-2);
      overflow: hidden;
    }
    @media (min-width: 640px) { .card-media { max-height: 88px; } }
    .card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card-media .placeholder {
      width: 100%; height: 100%; display: grid; place-items: center; color: var(--muted);
      font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase;
    }
    .badge {
      position: absolute; top: 10px; right: 10px; padding: 5px 10px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 700; border: 1px solid transparent; backdrop-filter: blur(8px);
    }
    .badge.ok { background: rgba(61, 255, 154, 0.15); border-color: rgba(61, 255, 154, 0.35); color: var(--ok); }
    .badge.low { background: rgba(255, 43, 214, 0.15); border-color: rgba(255, 43, 214, 0.4); color: #ff9ae6; }
    .badge.out { background: rgba(255, 77, 109, 0.15); border-color: rgba(255, 77, 109, 0.4); color: #ff9aab; }
    .card-body { padding: 14px 14px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .card-body h3 { font-size: 1.05rem; font-weight: 700; line-height: 1.3; word-break: break-word; }
    .price { font-size: 1.2rem; font-weight: 800; color: var(--cyan); text-shadow: 0 0 12px rgba(0, 245, 255, 0.35); }
    .meta { color: var(--muted); font-size: 0.85rem; }
    .card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 4px; }
    .card-actions button { flex: 1; padding: 9px 10px; font-size: 0.85rem; }
    .empty {
      grid-column: 1 / -1; text-align: center; padding: 56px 20px; border: 1px dashed var(--line);
      border-radius: var(--radius); background: rgba(0,0,0,0.2); color: var(--muted);
    }
    .empty strong { display: block; color: var(--text); font-size: 1.1rem; margin-bottom: 8px; }
    .overlay {
      position: fixed; inset: 0; z-index: 50; background: rgba(2, 4, 12, 0.72);
      backdrop-filter: blur(8px); display: none; align-items: flex-end; justify-content: center; padding: 16px;
    }
    .overlay.open { display: flex; }
    @media (min-width: 640px) { .overlay { align-items: center; } }
    .modal {
      width: min(520px, 100%); max-height: min(92vh, 900px); overflow: auto;
      border-radius: calc(var(--radius) + 4px); border: 1px solid var(--line-strong);
      background: linear-gradient(180deg, #10162c, #0a0e1c);
      box-shadow: 0 0 40px rgba(0, 245, 255, 0.15), 0 20px 50px rgba(0,0,0,0.55); padding: 20px;
    }
    .modal h2 {
      font-size: 1.2rem; margin-bottom: 16px;
      background: linear-gradient(90deg, var(--cyan), var(--magenta));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .form-grid { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-size: 0.85rem; color: var(--muted); }
    label span { font-weight: 600; color: var(--text); }
    input[type="text"], input[type="number"], textarea {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line);
      background: rgba(0,0,0,0.35); color: var(--text); font: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0, 245, 255, 0.12); }
    textarea { min-height: 72px; resize: vertical; }
    .photo-preview {
      width: 100%; aspect-ratio: 16 / 10; border-radius: 12px; border: 1px dashed var(--line);
      background: var(--bg-2); overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 0.85rem;
    }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
    .photo-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .photo-actions input[type="file"] { display: none; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .setup {
      border: 1px solid rgba(255, 176, 32, 0.35); background: rgba(255, 176, 32, 0.08);
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: 20px; color: #ffe6b0; font-size: 0.9rem; line-height: 1.5;
    }
    .setup code { background: rgba(0,0,0,0.35); padding: 1px 6px; border-radius: 6px; color: var(--cyan); font-size: 0.85em; }
    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); z-index: 80;
      padding: 12px 18px; border-radius: 999px; border: 1px solid var(--line-strong);
      background: rgba(8, 12, 28, 0.92); color: var(--text); font-size: 0.9rem; opacity: 0; pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease; box-shadow: 0 0 24px rgba(0, 245, 255, 0.2);
      max-width: calc(100% - 32px); text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    footer { margin-top: 32px; text-align: center; color: var(--muted); font-size: 0.8rem; }
    @media (max-width: 480px) { .row-2 { grid-template-columns: 1fr; } header { padding: 16px; } }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1><span class="title-prefix">Artículos</span><span class="shop-name">HermosilloShop</span></h1>
        <p>Catálogo compartido en la nube</p>
      </div>
      <div class="header-actions">
        <button type="button" class="ghost" id="btnRefresh">Actualizar</button>
        <button type="button" class="ghost" id="btnImport">Importar</button>
        <button type="button" class="ghost" id="btnExport">Exportar</button>
        <button type="button" class="primary" id="btnAdd">+ Agregar artículo</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden />
      </div>
    </header>

    <div class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="statusText">Conectando…</span>
    </div>

    <div class="setup" id="setupBox" hidden>
      <strong>Falta configurar Supabase.</strong>
      Abre este archivo, busca <code>CONFIG</code> en el script y pega tu
      <code>SUPABASE_URL</code> y <code>SUPABASE_ANON_KEY</code>.
    </div>

    <div class="toolbar">
      <div class="search">
        <input type="search" id="search" placeholder="Buscar por nombre..." autocomplete="off" />
      </div>
      <div class="stats">
        <div class="stat">Artículos: <strong id="statCount">0</strong></div>
        <div class="stat">Stock total: <strong id="statStock">0</strong></div>
      </div>
    </div>

    <div class="grid" id="grid" aria-live="polite"></div>
    <footer>HermosilloShop · sincronizado con Supabase</footer>
  </div>

  <div class="overlay" id="overlay" role="dialog" aria-modal="true">
    <div class="modal">
      <h2 id="modalTitle">Nuevo artículo</h2>
      <form id="form" class="form-grid" novalidate>
        <input type="hidden" id="editId" />
        <label>
          <span>Nombre</span>
          <input type="text" id="name" required maxlength="80" placeholder="Ej. Powerbank 20000mAh" />
        </label>
        <label>
          <span>Descripción (opcional)</span>
          <textarea id="description" maxlength="240" placeholder="Detalles del producto"></textarea>
        </label>
        <div class="row-2">
          <label>
            <span>Precio (MXN)</span>
            <input type="number" id="price" required min="0" step="0.01" placeholder="0.00" />
          </label>
          <label>
            <span>Existencia</span>
            <input type="number" id="stock" required min="0" step="1" placeholder="0" />
          </label>
        </div>
        <div>
          <span style="font-size:0.85rem;color:var(--muted)"><strong style="color:var(--text)">Foto</strong></span>
          <div class="photo-preview" id="photoPreview" style="margin-top:8px">Sin foto</div>
          <div class="photo-actions" style="margin-top:10px">
            <button type="button" id="btnPickPhoto">Elegir foto</button>
            <button type="button" class="ghost" id="btnClearPhoto">Quitar foto</button>
            <input type="file" id="photoFile" accept="image/*" />
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="ghost" id="btnCancel">Cancelar</button>
          <button type="submit" class="primary" id="btnSave">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <script>
    /* =========================================================
       CONFIG — pega aquí tus datos de Supabase (gratis)
       Project Settings → API → Project URL + anon public key
       ========================================================= */
    const CONFIG = {
      SUPABASE_URL: "https://gaojenaelyunaqulzwxu.supabase.co",
      SUPABASE_ANON_KEY: "sb_publishable_U0OOtnPlkNGyCI8jHRufAA_nwR_AYlQ",
      BUCKET: "product-photos",
    };

    const isConfigured =
      CONFIG.SUPABASE_URL.startsWith("http") &&
      CONFIG.SUPABASE_ANON_KEY.length > 20 &&
      !CONFIG.SUPABASE_URL.includes("PEGA_AQUI");

    const supabaseClient = isConfigured
      ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY)
      : null;

    const els = {
      grid: document.getElementById("grid"),
      search: document.getElementById("search"),
      statCount: document.getElementById("statCount"),
      statStock: document.getElementById("statStock"),
      overlay: document.getElementById("overlay"),
      form: document.getElementById("form"),
      modalTitle: document.getElementById("modalTitle"),
      editId: document.getElementById("editId"),
      name: document.getElementById("name"),
      description: document.getElementById("description"),
      price: document.getElementById("price"),
      stock: document.getElementById("stock"),
      photoPreview: document.getElementById("photoPreview"),
      photoFile: document.getElementById("photoFile"),
      btnAdd: document.getElementById("btnAdd"),
      btnExport: document.getElementById("btnExport"),
      btnImport: document.getElementById("btnImport"),
      btnRefresh: document.getElementById("btnRefresh"),
      importFile: document.getElementById("importFile"),
      btnCancel: document.getElementById("btnCancel"),
      btnPickPhoto: document.getElementById("btnPickPhoto"),
      btnClearPhoto: document.getElementById("btnClearPhoto"),
      btnSave: document.getElementById("btnSave"),
      toast: document.getElementById("toast"),
      statusDot: document.getElementById("statusDot"),
      statusText: document.getElementById("statusText"),
      setupBox: document.getElementById("setupBox"),
    };

    let articles = [];
    let pendingPhotoDataUrl = null;
    let existingPhotoUrl = null;
    let removePhoto = false;
    let toastTimer = 0;

    function setStatus(kind, text) {
      els.statusDot.className = "status-dot" + (kind === "ok" ? " ok" : kind === "warn" ? " warn" : "");
      els.statusText.textContent = text;
    }

    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => els.toast.classList.remove("show"), 2400);
    }

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    }

    function money(n) {
      return new Intl.NumberFormat("es-MX", {
        style: "currency", currency: "MXN", maximumFractionDigits: 2,
      }).format(Number(n) || 0);
    }

    function stockBadge(stock) {
      if (stock <= 0) return { cls: "out", text: "Agotado" };
      if (stock <= 5) return { cls: "low", text: "Bajo stock" };
      return { cls: "ok", text: "En stock" };
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function filtered() {
      const q = els.search.value.trim().toLowerCase();
      const list = [...articles].sort((a, b) => String(b.updated_at || "").localeCompare(String(a.updated_at || "")));
      if (!q) return list;
      return list.filter((a) => a.name.toLowerCase().includes(q) || (a.description || "").toLowerCase().includes(q));
    }

    function render() {
      const list = filtered();
      els.statCount.textContent = String(articles.length);
      els.statStock.textContent = String(articles.reduce((s, a) => s + (Number(a.stock) || 0), 0));
      if (list.length === 0) {
        els.grid.innerHTML = `<div class="empty"><strong>${articles.length === 0 ? "Sin artículos aún" : "Sin resultados"}</strong>${articles.length === 0 ? "Toca “Agregar artículo” para crear el primero en la nube." : "Prueba con otro término de búsqueda."}</div>`;
        return;
      }
      els.grid.innerHTML = list.map((a) => {
        const badge = stockBadge(a.stock);
        const media = a.photo_url
          ? `<img src="${escapeHtml(a.photo_url)}" alt="${escapeHtml(a.name)}" loading="lazy" />`
          : `<div class="placeholder">Sin foto</div>`;
        return `<article class="card" data-id="${a.id}">
          <div class="card-media">${media}<span class="badge ${badge.cls}">${badge.text}</span></div>
          <div class="card-body">
            <h3>${escapeHtml(a.name)}</h3>
            <div class="price">${money(a.price)}</div>
            <div class="meta">Existencia: <strong style="color:var(--text)">${Number(a.stock) || 0}</strong></div>
            ${a.description ? `<div class="meta">${escapeHtml(a.description)}</div>` : ""}
            <div class="card-actions">
              <button type="button" data-action="edit">Editar</button>
              <button type="button" class="danger" data-action="delete">Eliminar</button>
            </div>
          </div>
        </article>`;
      }).join("");
    }

    async function loadArticles() {
      if (!supabaseClient) {
        setStatus("", "Sin configurar Supabase");
        els.setupBox.hidden = false;
        render();
        return;
      }
      setStatus("warn", "Cargando catálogo…");
      const { data, error } = await supabaseClient
        .from("articles")
        .select("id,name,description,price,stock,photo_url,updated_at")
        .order("updated_at", { ascending: false });
      if (error) {
        console.error(error);
        setStatus("", "Error: " + error.message);
        toast("No se pudo cargar el catálogo");
        return;
      }
      articles = data || [];
      setStatus("ok", "En línea · " + articles.length + " artículo(s)");
      render();
    }

    function dataUrlToBlob(dataUrl) {
      const parts = dataUrl.split(",");
      const mime = parts[0].match(/:(.*?);/)[1];
      const bin = atob(parts[1]);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith("image/")) { reject(new Error("El archivo debe ser una imagen.")); return; }
        if (file.size > 4 * 1024 * 1024) { reject(new Error("La imagen debe pesar menos de 4 MB.")); return; }
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const max = 320;
            let { width, height } = img;
            if (width > max || height > max) {
              const scale = Math.min(max / width, max / height);
              width = Math.round(width * scale);
              height = Math.round(height * scale);
            }
            const canvas = document.createElement("canvas");
            canvas.width = width; canvas.height = height;
            canvas.getContext("2d").drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.68));
          };
          img.onerror = () => reject(new Error("No se pudo leer la imagen."));
          img.src = String(reader.result);
        };
        reader.onerror = () => reject(new Error("No se pudo leer el archivo."));
        reader.readAsDataURL(file);
      });
    }

    async function uploadPhoto(dataUrl, articleId) {
      const blob = dataUrlToBlob(dataUrl);
      const path = articleId + "/" + Date.now() + ".jpg";
      const { error } = await supabaseClient.storage.from(CONFIG.BUCKET).upload(path, blob, {
        contentType: "image/jpeg", upsert: true,
      });
      if (error) throw error;
      const { data } = supabaseClient.storage.from(CONFIG.BUCKET).getPublicUrl(path);
      return data.publicUrl;
    }

    function openModal(article) {
      removePhoto = false;
      pendingPhotoDataUrl = null;
      if (article) {
        els.modalTitle.textContent = "Editar artículo";
        els.editId.value = article.id;
        els.name.value = article.name;
        els.description.value = article.description || "";
        els.price.value = String(article.price);
        els.stock.value = String(article.stock);
        existingPhotoUrl = article.photo_url || null;
      } else {
        els.modalTitle.textContent = "Nuevo artículo";
        els.editId.value = "";
        els.form.reset();
        existingPhotoUrl = null;
      }
      renderPhotoPreview();
      els.overlay.classList.add("open");
      setTimeout(() => els.name.focus(), 50);
    }

    function closeModal() {
      els.overlay.classList.remove("open");
      pendingPhotoDataUrl = null;
      existingPhotoUrl = null;
      removePhoto = false;
      els.photoFile.value = "";
    }

    function renderPhotoPreview() {
      if (pendingPhotoDataUrl) {
        els.photoPreview.innerHTML = '<img src="' + pendingPhotoDataUrl + '" alt="Vista previa" />';
      } else if (existingPhotoUrl && !removePhoto) {
        els.photoPreview.innerHTML = '<img src="' + existingPhotoUrl + '" alt="Vista previa" />';
      } else {
        els.photoPreview.textContent = "Sin foto";
      }
    }

    els.btnAdd.addEventListener("click", () => {
      if (!supabaseClient) { toast("Configura Supabase primero"); return; }
      openModal(null);
    });
    els.btnCancel.addEventListener("click", closeModal);
    els.overlay.addEventListener("click", (e) => { if (e.target === els.overlay) closeModal(); });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && els.overlay.classList.contains("open")) closeModal();
    });

    els.btnPickPhoto.addEventListener("click", () => els.photoFile.click());
    els.btnClearPhoto.addEventListener("click", () => {
      pendingPhotoDataUrl = null; removePhoto = true; els.photoFile.value = ""; renderPhotoPreview();
    });

    els.photoFile.addEventListener("change", async () => {
      const file = els.photoFile.files && els.photoFile.files[0];
      if (!file) return;
      try {
        pendingPhotoDataUrl = await compressImage(file);
        removePhoto = false;
        renderPhotoPreview();
      } catch (err) {
        toast(err.message || "Error al cargar la foto");
        els.photoFile.value = "";
      }
    });

    els.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!supabaseClient) return;
      const name = els.name.value.trim();
      const description = els.description.value.trim();
      const price = Number(els.price.value);
      const stock = Number(els.stock.value);
      if (!name) { toast("Escribe un nombre"); return; }
      if (!Number.isFinite(price) || price < 0) { toast("Precio inválido"); return; }
      if (!Number.isFinite(stock) || stock < 0 || !Number.isInteger(stock)) {
        toast("Existencia inválida (usa enteros)"); return;
      }
      els.btnSave.disabled = true;
      try {
        const id = els.editId.value || uid();
        let photo_url = existingPhotoUrl;
        if (removePhoto) photo_url = null;
        if (pendingPhotoDataUrl) photo_url = await uploadPhoto(pendingPhotoDataUrl, id);
        const row = {
          id, name, description, price, stock, photo_url,
          updated_at: new Date().toISOString(),
        };
        const { error } = await supabaseClient.from("articles").upsert(row);
        if (error) throw error;
        toast(els.editId.value ? "Artículo actualizado" : "Artículo agregado");
        closeModal();
        await loadArticles();
      } catch (err) {
        console.error(err);
        toast(err.message || "Error al guardar");
      } finally {
        els.btnSave.disabled = false;
      }
    });

    els.grid.addEventListener("click", async (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const card = btn.closest("[data-id]");
      if (!card) return;
      const id = card.getAttribute("data-id");
      const article = articles.find((a) => a.id === id);
      if (!article) return;
      if (btn.getAttribute("data-action") === "edit") { openModal(article); return; }
      if (btn.getAttribute("data-action") === "delete") {
        if (!confirm("¿Eliminar \"" + article.name + "\"?")) return;
        const { error } = await supabaseClient.from("articles").delete().eq("id", id);
        if (error) { toast("No se pudo eliminar"); return; }
        toast("Artículo eliminado");
        await loadArticles();
      }
    });

    els.search.addEventListener("input", render);
    els.btnRefresh.addEventListener("click", () => loadArticles());

    els.btnExport.addEventListener("click", () => {
      const payload = { app: "HermosilloShop", version: 2, exportedAt: new Date().toISOString(), articles };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "hermosillo-shop-catalogo.json"; a.click();
      URL.revokeObjectURL(url);
      toast("Catálogo exportado");
    });

    els.btnImport.addEventListener("click", () => {
      if (!supabaseClient) { toast("Configura Supabase primero"); return; }
      els.importFile.click();
    });

    els.importFile.addEventListener("change", async () => {
      const file = els.importFile.files && els.importFile.files[0];
      els.importFile.value = "";
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        const list = Array.isArray(data) ? data : data.articles;
        if (!Array.isArray(list) || list.length === 0) { toast("El archivo no tiene artículos válidos"); return; }
        if (!confirm("Se importarán " + list.length + " artículo(s) a la nube. ¿Continuar?")) return;
        const rows = list.map((item) => {
          if (!item || typeof item !== "object") return null;
          const name = String(item.name || "").trim();
          if (!name) return null;
          const price = Number(item.price);
          const stock = Number(item.stock);
          return {
            id: item.id && String(item.id) ? String(item.id) : uid(),
            name: name.slice(0, 80),
            description: String(item.description || "").slice(0, 240),
            price: Number.isFinite(price) && price >= 0 ? price : 0,
            stock: Number.isFinite(stock) && stock >= 0 ? Math.floor(stock) : 0,
            photo_url: typeof item.photo_url === "string" ? item.photo_url
              : (typeof item.photo === "string" && item.photo.startsWith("http") ? item.photo : null),
            updated_at: new Date().toISOString(),
          };
        }).filter(Boolean);
        const { error } = await supabaseClient.from("articles").upsert(rows);
        if (error) throw error;
        toast("Importación lista");
        await loadArticles();
      } catch (err) {
        console.error(err);
        toast("No se pudo importar");
      }
    });

    if (supabaseClient) {
      supabaseClient.channel("articles-live")
        .on("postgres_changes", { event: "*", schema: "public", table: "articles" }, () => loadArticles())
        .subscribe();
    }

    loadArticles();
  </script>
</body>
</html>
